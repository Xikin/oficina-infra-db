name: Terraform RDS

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destruir a stack em vez de aplicar"
        type: boolean
        default: false

concurrency:
  group: terraform-db-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}

jobs:
  terraform:
    name: ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar se as credenciais do lab ainda são válidas
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::Credenciais AWS expiradas. Atualize os secrets a partir de AWS Details -> AWS CLI no Learner Lab."
            exit 1
          fi

      - name: Verificar se a stack de rede já existe
        run: |
          if ! aws ssm get-parameter --name "/oficina/${TF_VAR_environment}/network/vpc_id" >/dev/null 2>&1; then
            echo "::error::A VPC ainda não existe. Rode o pipeline do repositório oficina-infra-k8s antes deste — ele publica /oficina/${TF_VAR_environment}/network/* no SSM."
            exit 1
          fi

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=infra-db/${TF_VAR_environment}/terraform.tfstate"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Comentar o plan no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = (process.env.PLAN || '').slice(0, 60000)
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan — RDS PostgreSQL (\`${process.env.TF_VAR_environment}\`)\n\n<details><summary>Ver plano</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`
            })

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.destroy
        run: terraform destroy -input=false -auto-approve

      - name: Resumo do banco
        if: github.event_name == 'push'
        run: |
          {
            echo "## RDS PostgreSQL provisionado"
            echo ""
            echo "| Recurso | Valor |"
            echo "| --- | --- |"
            echo "| Endpoint | \`$(terraform-bin output -raw db_endpoint)\` |"
            echo "| Banco | \`$(terraform-bin output -raw db_name)\` |"
            echo "| Usuário | \`$(terraform-bin output -raw db_username)\` |"
            echo "| DATABASE_URL | SSM \`$(terraform-bin output -raw database_url_ssm_parameter)\` |"
            echo ""
            echo "A senha nunca aparece em log: fica apenas no SSM como SecureString."
          } >> "$GITHUB_STEP_SUMMARY"
